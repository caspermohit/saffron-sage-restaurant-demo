name: saffron-restaurant
services:
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in root .env}
      APP_URL: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-saffron}
      DB_USERNAME: ${MYSQL_USER:-saffron}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      LOG_CHANNEL: stderr
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      STAFF_EMAIL: ${STAFF_EMAIL:-manager@saffron.local}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Set STAFF_PASSWORD}
      RESTAURANT_WIFI_PASSWORD: ${RESTAURANT_WIFI_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-saffron}
      MYSQL_USER: ${MYSQL_USER:-saffron}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  mysql-data:
